name: darim
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wishlist
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wishlist -d wishlist']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  app:
    image: darim:local
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment: &app_environment
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Database=wishlist;Username=wishlist;Password=${POSTGRES_PASSWORD}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}
      Telegram__ClientId: ${TELEGRAM_CLIENT_ID:-}
      Telegram__ClientSecret: ${TELEGRAM_CLIENT_SECRET:-}
      DataProtection__Path: /keys
      Proxy__Address: 172.28.44.2
      AllowedHosts: ${DOMAIN:?Set DOMAIN}
    volumes:
      - keys:/keys
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
  migrate:
    image: darim:local
    profiles: [tools]
    command: [--migrate]
    environment: *app_environment
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks:
      private:
        ipv4_address: 172.28.44.2
  backup:
    profiles: [tools]
    build:
      context: .
      dockerfile: ops/Dockerfile.backup
    environment:
      PGHOST: db
      PGDATABASE: wishlist
      PGUSER: wishlist
      PGPASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
networks:
  private:
    ipam:
      config: [{subnet: 172.28.44.0/24, ip_range: 172.28.44.128/25}]
volumes:
  postgres:
  keys:
  caddy_data:
  caddy_config:
