# Only trusted main commits run on this single-server installation.
when:
  - event: [push, manual]
    branch: main

steps:
  - name: tests-and-build
    image: docker:27-cli
    volumes:
      - /run/ci/docker.sock:/var/run/docker.sock
    commands:
      - sh ops/woodpecker-build.sh

  - name: publish-verified-image
    image: docker:27-cli
    volumes:
      - /run/ci/docker.sock:/var/run/docker.sock
    commands:
      - sh ops/publish-woodpecker-image.sh
    when:
      - event: push
        branch: main

  - name: production-deployment
    image: alpine:3.22
    commands:
      - apk add --no-cache curl jq
      - sh ops/wait-production.sh
    when:
      - event: push
        branch: main
