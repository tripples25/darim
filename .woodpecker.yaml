# Only trusted main commits run on this single-server installation.
when:
  - event: [push, manual]
    branch: main

steps:
  - name: tests-and-build
    image: docker:27-cli
    volumes:
      - /run/ci/docker.sock:/var/run/docker.sock
    commands:
      - sh ops/woodpecker-build.sh

  - name: read-production-revision
    image: alpine:3.22
    failure: ignore
    commands:
      - apk add --no-cache curl jq
      - |
        response=$(curl -fsS --max-time 10 https://wishes.hype-ny.ru/deployment.json) || response='{}'
        printf '%s\n' "$response" | jq -r '.current.commit // empty' > .previous-production
    when:
      - event: push
        branch: main

  - name: publish-verified-image
    image: docker:27-cli
    volumes:
      - /run/ci/docker.sock:/var/run/docker.sock
    commands:
      - sh ops/publish-woodpecker-image.sh
    when:
      - event: push
        branch: main

  - name: production-deployment
    image: alpine:3.22
    commands:
      - apk add --no-cache curl jq
      - sh ops/wait-production.sh
    when:
      - event: push
        branch: main

  - name: telegram-api-release
    image: alpine:3.22
    failure: ignore
    environment:
      TELEGRAM_BOT_TOKEN:
        from_secret: telegram_bot_token
      TELEGRAM_LICKREAL_ID:
        from_secret: telegram_lickreal_id
      TELEGRAM_SHARPHURT_ID:
        from_secret: telegram_sharphurt_id
    commands:
      - apk add --no-cache curl jq git
      - git fetch --unshallow origin || git fetch origin
      - sh ops/telegram-ci.sh release
    when:
      - event: push
        branch: main
        status: [success]

  - name: telegram-pipeline-failure
    image: alpine:3.22
    failure: ignore
    environment:
      TELEGRAM_BOT_TOKEN:
        from_secret: telegram_bot_token
      TELEGRAM_LICKREAL_ID:
        from_secret: telegram_lickreal_id
      TELEGRAM_SHARPHURT_ID:
        from_secret: telegram_sharphurt_id
    commands:
      - apk add --no-cache curl jq
      - sh ops/telegram-ci.sh failure
    when:
      - status: [failure]
