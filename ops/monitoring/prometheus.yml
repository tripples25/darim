global:
  scrape_interval: 15s
  scrape_timeout: 5s

storage:
  tsdb:
    retention:
      time: 15d
      size: 1GB

scrape_configs:
  - job_name: darim
    metrics_path: /metrics
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /run/secrets/scrape_token
    file_sd_configs:
      - files: [/etc/prometheus/targets.yml]
  - job_name: darim-system
    static_configs:
      - targets: ['172.28.45.1:9100']
