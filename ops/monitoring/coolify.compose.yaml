services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --web.listen-address=172.28.45.1:9100
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.diskstats
      - --collector.filesystem
      - --collector.loadavg
      - --collector.meminfo
      - --collector.netdev
      - --collector.stat
      - --collector.time
      - --collector.uname
      - --collector.vmstat
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$'
    network_mode: host
    pid: host
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.20
    pids_limit: 32
    tmpfs: ['/tmp:rw,noexec,nosuid,size=8m']
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind: { propagation: rslave }
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - /opt/darim-monitoring/source/ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/darim-monitoring/targets.yml:/etc/prometheus/targets.yml:ro
      - /opt/darim-monitoring/secrets/scrape-token:/run/secrets/scrape_token:ro
      - prometheus-data:/prometheus
    networks: [default, darim-edge]
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.hype-ny.ru/
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - /opt/darim-monitoring/source/ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/darim-monitoring/source/ops/monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - /opt/darim-monitoring/secrets/grafana-password:/run/secrets/grafana_password:ro
      - grafana-data:/var/lib/grafana
    networks:
      default:
      darim-edge:
        aliases: [darim-monitoring-grafana]
networks:
  darim-edge:
    external: true
volumes:
  prometheus-data:
  grafana-data:
