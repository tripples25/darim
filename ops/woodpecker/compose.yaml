x-rotated-logging: &rotated-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  server:
    image: woodpeckerci/woodpecker-server:v3.20.1
    pull_policy: never
    restart: unless-stopped
    logging: *rotated-logging
    environment:
      WOODPECKER_HOST: https://ci.hype-ny.ru
      WOODPECKER_OPEN: 'false'
      WOODPECKER_ADMIN: tripples25
      WOODPECKER_REPO_OWNERS: tripples25
      WOODPECKER_GITHUB: 'true'
      WOODPECKER_GITHUB_PUBLIC_ONLY: 'true'
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
    volumes:
      - server_data:/var/lib/woodpecker
    networks:
      default: {}
      edge:
        aliases: [woodpecker-coolify]
  worker-docker:
    image: docker:27-dind
    pull_policy: never
    restart: unless-stopped
    privileged: true
    command: [dockerd, '--host=unix:///run/ci/docker.sock', '--log-driver=json-file', '--log-opt=max-size=10m', '--log-opt=max-file=3']
    logging: *rotated-logging
    environment:
      DOCKER_TLS_CERTDIR: ''
    mem_limit: 3g
    ports: ['127.0.0.1:5000:5000']
    volumes:
      - worker_data:/var/lib/docker
      - worker_socket:/run/ci
  agent:
    image: woodpeckerci/woodpecker-agent:v3.20.1
    pull_policy: never
    restart: unless-stopped
    command: agent
    logging: *rotated-logging
    depends_on: [server, worker-docker]
    environment:
      WOODPECKER_SERVER: server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_BACKEND_DOCKER_HOST: unix:///run/ci/docker.sock
      WOODPECKER_MAX_WORKFLOWS: '1'
    volumes:
      - agent_data:/etc/woodpecker
      - worker_socket:/run/ci
  registry:
    image: registry:3
    restart: unless-stopped
    logging: *rotated-logging
    network_mode: service:worker-docker
    depends_on:
      worker-docker:
        condition: service_started
        restart: true
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
    volumes:
      - registry_data:/var/lib/registry
networks:
  edge:
    external: true
    name: darim-edge
volumes:
  server_data:
    external: true
    name: darim-ci_server_data
  agent_data:
    external: true
    name: darim-ci_agent_data
  worker_data:
    external: true
    name: darim-ci_worker_data
  worker_socket:
    external: true
    name: darim-ci_worker_socket
  registry_data:
