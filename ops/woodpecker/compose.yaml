name: darim-ci
services:
  server:
    image: woodpeckerci/woodpecker-server:v3.20.1
    restart: unless-stopped
    environment:
      WOODPECKER_HOST: https://ci.hype-ny.ru
      WOODPECKER_OPEN: 'false'
      WOODPECKER_ADMIN: tripples25
      WOODPECKER_REPO_OWNERS: tripples25
      WOODPECKER_GITHUB: 'true'
      WOODPECKER_GITHUB_PUBLIC_ONLY: 'true'
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT:?Required}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET:?Required}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?Required}
    volumes:
      - server_data:/var/lib/woodpecker
    networks: [control, edge]
  worker-docker:
    image: docker:27-dind
    restart: unless-stopped
    privileged: true
    command: [dockerd, '--host=unix:///run/ci/docker.sock']
    environment:
      DOCKER_TLS_CERTDIR: ''
    mem_limit: 3g
    volumes:
      - worker_data:/var/lib/docker
      - worker_socket:/run/ci
    networks: [control]
  agent:
    image: woodpeckerci/woodpecker-agent:v3.20.1
    command: agent
    restart: unless-stopped
    depends_on: [server, worker-docker]
    environment:
      WOODPECKER_SERVER: server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?Required}
      WOODPECKER_BACKEND_DOCKER_HOST: unix:///run/ci/docker.sock
      WOODPECKER_MAX_WORKFLOWS: '1'
    volumes:
      - agent_data:/etc/woodpecker
      - worker_socket:/run/ci
    networks: [control]
networks:
  control:
  edge:
    name: darim-edge
    external: true
volumes:
  server_data:
  agent_data:
  worker_data:
  worker_socket:
