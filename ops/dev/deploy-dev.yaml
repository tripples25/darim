skip_clone: true

steps:
  - name: deploy-dev
    image: node:24-bookworm-slim
    environment:
      TEST_WEBHOOK_SECRET:
        from_secret: coolify_dev_webhook_secret
    commands:
      - |
        node --input-type=module <<'JS'
        import { createHmac } from 'node:crypto'

        const { CI_COMMIT_SHA: commit, CI_REPO: repository, TEST_WEBHOOK_SECRET: secret } = process.env
        if (!secret || !/^[a-f0-9]{40}$/.test(commit) || !repository) {
          throw new Error('Missing test deployment secret or commit metadata')
        }
        const body = JSON.stringify({
          ref: 'refs/heads/dev',
          after: commit,
          repository: { full_name: repository },
        })
        const signature = createHmac('sha256', secret).update(body).digest('hex')
        const response = await fetch('https://coolify.hype-ny.ru/webhooks/source/github/events/manual', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-GitHub-Event': 'push',
            'X-Hub-Signature-256': 'sha256=' + signature,
          },
          body,
          signal: AbortSignal.timeout(30000),
        })
        if (!response.ok) throw new Error('Coolify webhook returned HTTP ' + response.status)
        const result = await response.json()
        const deployment = (Array.isArray(result) ? result.flat(Infinity) : [result])
          .find(item => item.status === 'success' && item.deployment_uuid)
        if (!deployment) throw new Error('Coolify did not queue the test deployment')
        console.log('Coolify deployment ' + deployment.deployment_uuid)
        JS
    when:
      - event: push
        branch: dev
