skip_clone: true
steps:

  - name: deploy-dev
    image: alpine:3.22
    environment:
      TEST_WEBHOOK_SECRET:
        from_secret: coolify_dev_webhook_secret
    commands:
      - apk add --no-cache curl jq openssl
      - |
        test -n "$TEST_WEBHOOK_SECRET"
        payload=$(jq -cn --arg sha "$CI_COMMIT_SHA" --arg repo "$CI_REPO" \
          '{ref:"refs/heads/dev", after:$sha, repository:{full_name:$repo}}')
        signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$TEST_WEBHOOK_SECRET" | awk '{print $NF}')
        curl --fail --silent --show-error --max-time 30 \
          -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
          -H "X-Hub-Signature-256: sha256=$signature" --data "$payload" \
          https://coolify.hype-ny.ru/webhooks/source/github/events/manual |
          jq -er '.. | objects | select(.status == "success") | .deployment_uuid'
    when:
      - event: push
        branch: dev
